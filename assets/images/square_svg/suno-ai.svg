<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-suno-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow-suno-ai" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Dark Squircle Canvas (App Icon Look) -->
  <rect x="20" y="20" width="560" height="560" rx="130" fill="url(#bg-suno-ai)" stroke="#334155" stroke-width="3" />

  <!-- Soft Ambient Glow matching Brand Color -->
  <circle cx="300" cy="300" r="160" fill="#ffffff" opacity="0.14" filter="url(#glow-suno-ai)" />

  <!-- Centered Scaled Official Vector Emblem -->
  <svg x="140" y="140" width="320" height="320" viewBox="0 0 24 24" style="overflow:visible">
    <g fill="#ffffff"><path d="M16.5 0C20.642 0 24 5.373 24 12h-9c0 6.627-3.358 12-7.5 12C3.358 24 0 18.627 0 12h9c0-6.627 3.358-12 7.5-12z"></path></g>
  </svg>
</svg>