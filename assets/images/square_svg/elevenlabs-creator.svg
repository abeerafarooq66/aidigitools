<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-elevenlabs-creator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow-elevenlabs-creator" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Dark Squircle Canvas (App Icon Look) -->
  <rect x="20" y="20" width="560" height="560" rx="130" fill="url(#bg-elevenlabs-creator)" stroke="#334155" stroke-width="3" />

  <!-- Soft Ambient Glow matching Brand Color -->
  <circle cx="300" cy="300" r="160" fill="#ffffff" opacity="0.14" filter="url(#glow-elevenlabs-creator)" />

  <!-- Centered Scaled Official Vector Emblem -->
  <svg x="140" y="140" width="320" height="320" viewBox="0 0 24 24" style="overflow:visible">
    <g fill="#ffffff"><path d="M5 0h5v24H5V0zM14 0h5v24h-5V0z"></path></g>
  </svg>
</svg>