name: Autonomous SEO & Website Engineer (Twice Daily)

on:
  schedule:
    # 08:00 PKT (03:00 UTC) and 20:00 PKT (15:00 UTC) every day in Asia/Karachi (UTC+5)
    - cron: '0 3,15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Operating Mode (full: audit + reasoning + repair + report, audit: audit only, verify: live check)'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - audit
          - verify

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autonomous-engineer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomous-engineer-cycle:
    name: Execute Twice-Daily Autonomous Maintenance Cycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Cloud Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests

      - name: Run Autonomous SEO & Website Engineer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          echo "Executing Autonomous Engineer in mode: $MODE"
          python -m autonomous_engineer.cli --mode "$MODE"

      - name: Verify Comprehensive Site Test Battery
        run: |
          python -m unittest discover -s tests -v

      - name: Verify Strict Link Graph & Fragment Anchors
        run: |
          python scripts/link_graph_checker.py --strict

      - name: Persist Audit Reports & Commit Verified Fixes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add audit_reports/
          
          # Stage any low-risk auto-repairs (sitemap.xml or html canonicals)
          git add sitemap.xml *.html tools/ categories/ compare/ best/ guides/ 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "No report or code changes to commit."
          else
            echo "Committing audit report and verified autonomous updates..."
            git commit -m "chore(audit): automated twice-daily SEO & site health audit [skip ci]"
            git push origin main
          fi
