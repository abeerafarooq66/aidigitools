name: Credentials Preflight & Connection Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/credentials_preflight.py'
      - '.github/workflows/credentials-preflight.yml'

permissions:
  contents: write

jobs:
  preflight-test:
    name: Verify API Connections & Service Accounts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Google Auth Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth requests google-generativeai

      - name: Run Credential Preflight Live Test
        env:
          INDEXNOW_KEY: "89d63ab53a63527b12a199a3096e51ad"
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          BING_WEBMASTER_API_KEY: ${{ secrets.BING_API_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          CRUX_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_MANAGER_ID: ${{ secrets.GOOGLE_ADS_MANAGER_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
        run: |
          python scripts/credentials_preflight.py --test

      - name: Upload Credential Status Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-integrations-status-report
          path: |
            data/api_integrations_status.json
            data/search_intelligence_latest.json

      - name: Safely Persist Sanitized Integration Status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/api_integrations_status.json data/search_intelligence_latest.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(api): synchronize sanitized integration status ledger [skip ci]" && git pull --rebase origin main && git push)
