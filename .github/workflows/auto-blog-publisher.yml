name: Auto Blog Publisher

on:
  schedule:
    - cron: '0 4 * * *'  # 09:00 PKT daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Content Intelligence & Article Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY || '89d63ab53a63527b12a199a3096e51ad' }}
          GSC_SERVICE_ACCOUNT_KEY: ${{ secrets.GSC_SERVICE_ACCOUNT_KEY }}
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        run: |
          python -m seo-agent.agent.automation_scheduler --mode run-pipeline
          python scripts/generate_sitemap.py
          python -m aio_agent sync-llms
          python scripts/link_graph_checker.py --strict
